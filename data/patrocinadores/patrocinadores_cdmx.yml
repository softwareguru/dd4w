### Aliados y patrocinadores de la sede CDMX ###
#
# Misma estructura que patrocinadores_mty.yml:
#
#   patrocinio   empresas que aportan recursos, agrupadas por paquete
#   difusion     media partners: amplifican la convocatoria en sus canales
#   aliados      organizaciones aliadas que suman contenido y beneficios
#   comunidades  comunidades que convocan a sus miembros
#   organiza     quién produce el evento

patrocinio:
  - class: t-platinum
    label: Platinum
    logos:
      - name: SimplePractice
        image: images/logos/simple.png
        url: https://www.simplepractice.com/

      - name: Mobiik
        image: images/logos/mobik.png
        url: https://www.mobiik.com/jobs

      - name: ContPAQi
        image: images/logos/contpaqi-logo.png
        url: https://www.contpaqi.com/

  - class: t-silver
    label: Silver
    logos:
      - name: Qualtop
        image: images/logos/qualtop.png
        url: https://qualtop.com/

      - name: Impactclick
        image: images/logos/impact-click.png
        url: https://www.impactclick.org/

# CDMX no tuvo aliados de difusión; el bloque queda vacío y no se dibuja.
difusion:
  label: Aliados de difusión
  logos: []

aliados:
  label: Aliados
  logos:
    - name: Ardan Labs
      image: images/logos/ardan-labs-logo-badge.jpg
      url: https://www.ardanlabs.com/community/

    - name: GetOnBoard
      image: images/logos/getonboard.png
      url: https://www.getonbrd.com/

    - name: Packt
      image: images/logos/pack.png
      url: https://www.packtpub.com/

comunidades:
  label: Comunidades aliadas
  logos: []

organiza:
  label: Organizado por
  logos:
    - name: Code4DEI
      image: images/logos/code4dei-logo.png
      url: https://code4dei.com/

    - name: Software Guru
      image: images/logos/sg.jpg
      url: https://sg.com.mx/
