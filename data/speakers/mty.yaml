    bio: |-
      La Mtra. Elena Mitilene Rodríguez es una destacada profesional con una impresionante trayectoria en educación, mercadotecnia e innovación. Posee una Maestría en Educación y es Licenciada en Mercadotecnia Internacional por la (UERRE),  Su perfil se enriquece con una certificación internacional de Enactus, donde ha servido como juez mundial, y una especialización en Administración de Ventas Corporativas.

      Actualmente, se desempeña como DIRECTORA DE COMPETENCIA Y COMPETITIVIDAD de la Secretaria de Economía del gobierno del estado de Nuevo León, y anteriormente fue Directora del Laboratorio de Negocios en la UERRE, Directora comercial  la Asociación Mexicana de Diabetes de Nuevo León, Director de Desarrollo institucional en Villas ABP y forma parte del consejo de la CMM de Caintra.
      Ha recibido los premios Alvin Rohrs, por Economía inteligente en Latinoamérica y el premio Juan Servitje, un corazón para los negocios por parte de Enactus Global.

      Es coautora de los libros "Cambio de las Organizaciones sociales" y "Mercadotecnia Social", "Mujeres Líderes en Latinoamérica" con su dedicación ha dejado una huella significativa en los ámbitos académico, empresarial y social.

