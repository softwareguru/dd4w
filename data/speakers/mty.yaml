      Jefa de la División de Ingenierías en la UTZMG y docente universitaria con más de 15 años de experiencia en educación superior y tecnología.

      Es Técnico Superior Universitario en Sistemas Informáticos, Ingeniera en Tecnologías de la Información y Maestra en Educación. A lo largo de su trayectoria ha participado en proyectos de desarrollo de software, Internet de las Cosas (IoT), automatización e innovación educativa, promoviendo la adopción de tecnologías emergentes en entornos académicos y profesionales.

      Actualmente impulsa iniciativas relacionadas con Inteligencia Artificial y transformación digital, buscando acercar herramientas tecnológicas accesibles que permitan a estudiantes y profesionistas convertir ideas en soluciones reales.

  - name: "Lupita Garza"
    role: "Fundadora y CEO"
    org: "International Assembly"
    cat: "panel"
    photo: "lupita-garza.jpg"
    linkedin: "https://www.linkedin.com/in/ma-guadalupe-garza-9587b116/"
    bio: |-
      Lupita Garza Flores es una empresaria regiomontana destacada por su liderazgo empresarial, impulso al liderazgo femenino y compromiso social. Es licenciada en Administración de Empresas por el ITESM y cuenta con una maestría en Liderazgo Positivo por la Universidad Tecmilenio.

      Es fundadora y CEO de International Assembly, empresa del sector electrónico fundada en 1994, reconocida por su excelencia operativa con el Premio Nuevo León a la Competitividad en 2017.

      Ha sido una figura clave en el ecosistema empresarial: marcó un precedente al convertirse en la primera mujer en presidir el Consejo Guadalupe, así como en formar y encabezar la Comisión de Mujeres Industriales. Actualmente participa como consejera en organismos empresariales y financieros, además de coordinar iniciativas de filantropía.

      En el ámbito público fue Secretaria de Desarrollo Económico de Guadalupe (2020–2021) y candidata a diputada local en 2021. También presidió AMMJE Guadalupe (2022–2024).

      Actualmente preside GLOBAL4Her, organización internacional enfocada en el desarrollo de mujeres líderes. Su trayectoria ha sido reconocida con importantes distinciones, como la Medalla al Mérito Ciudadano (2019) y la Presea «María Elena Chapa Hernández» (2023).

  - name: "Marian Aranda"
    role: "Data Protection Officer & Compliance (GRC)"
    org: "DeepArmy"
    cat: "charla"
    photo: "marian-aranda.png"
    linkedin: ""
    bio: |-
      Marian Aranda es licenciada en Derecho, egresada de la Universidad De La Salle Bajío, y profesional en Gobierno, Riesgo y Cumplimiento (GRC) dentro de la industria de la ciberseguridad. Actualmente se desempeña como Data Protection Officer & Compliance en DeepArmy, empresa líder en servicios de SOC, ciberseguridad y seguridad de la información.

      Su trabajo se enfoca en la protección de datos, privacidad, cumplimiento regulatorio y gobierno de tecnologías emergentes, ayudando a empresas privadas e instituciones públicas a adoptar tecnologías de forma segura y alineada a estándares internacionales.

      Le apasiona la intersección entre derecho, tecnología y ciberseguridad, y promover una mayor participación de perfiles diversos de mujeres en STEM, demostrando que el futuro de la tecnología también se construye desde la gobernanza y el cumplimiento.

  - name: "Reyna Méndez"
    role: "Líder de Adopción y Automatización con IA"
    org: "GNC México"
