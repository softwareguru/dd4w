      Le apasiona explorar cómo la Inteligencia Artificial puede potenciar no solo la productividad, sino también la forma en que las personas aprenden, toman decisiones y generan valor dentro de las organizaciones.

  - name: "Rocío Vane Farías"
    role: "Líder fundadora del Centro de Futuros"
    org: "Met Conecta"
    cat: "charla"
    photo: "rocio-vane-farias.jpg"
    linkedin: ""
    bio: |-
      Maestra en Prospectiva Estratégica por la Escuela de Graduados en Administración Pública y Política Pública del Tecnológico de Monterrey y licenciada en Relaciones Internacionales por el Tecnológico de Monterrey, Campus Monterrey. Cuenta con una especialidad en Emprendimiento por el Instituto de Emprendimiento Eugenio Garza Lagüera, en alianza con Babson College, Berkeley University y Explora Internacional Silicon Valley. Actualmente es candidata al grado de Doctora en Administración.

      Es líder fundadora del Centro de Futuros en Met Conecta, empresa consultora en emprendimiento e innovación con enfoque en el diseño de futuros basados en metodologías de Prospectiva Estratégica, para el desarrollo de investigaciones y consultorías en el ámbito privado y público.

      Es miembro de la Constelación de Futuristas del Tecnológico de Monterrey y del Comité Directivo de la Red Mexicana de Futuros, y participante activa en la Red Iberoamericana de Prospectiva y la Red Latinoamericana de Futuros. Es facilitadora de «Futures Literacy Laboratories» bajo la metodología de Futuros de la UNESCO.

  - name: "Ruth Rodríguez Gallegos"
    role: "Profesora Asociada, Departamento de Ciencias"
    org: "Tecnológico de Monterrey"
    cat: "lightning"
    photo: "ruth-rodriguez-gallegos.jpg"
    linkedin: ""
    bio: |-
      Ruth Rodríguez Gallegos es Doctora en Matemáticas e Informática por la Universidad Joseph Fourier de Grenoble, Francia, y Profesora Asociada del Tecnológico de Monterrey, Campus Monterrey. Su trayectoria se ha desarrollado en la intersección entre educación matemática, ingeniería e innovación educativa, con especial interés en modelación matemática y formación de talento STEM.

      Actualmente coordina la Comisión de Educación de la Sociedad Matemática Mexicana (2026–2028) y el grupo latinoamericano Formación de Ingenieros desde la Matemática Educativa. Ha participado en proyectos de transformación curricular e innovación educativa, así como en iniciativas orientadas a impulsar la participación y desarrollo de mujeres en STEM.

      En los últimos años su trabajo ha incorporado la inteligencia artificial como herramienta para la enseñanza, la creación y el aprendizaje, explorando las posibilidades de colaboración entre las personas y las nuevas tecnologías.

  - name: "Santa Tejeda"
    role: "Profesora investigadora de tiempo completo"
    org: "Tecnológico de Monterrey"
    cat: "charla"
    photo: "santa-tejeda.jpg"
    linkedin: "https://www.linkedin.com/in/santa-tejeda-a0747896/"
    bio: |-
      Es coordinadora de proyectos STEM con impacto social y perspectiva de género en el Departamento de Ciencias del Tecnológico de Monterrey. Es profesora adjunta en el Grupo de Investigación del IFE: SOI-STEM. Es investigadora nivel I del Sistema Nacional de Investigadores, tesorera de la Asociación Americana de Profesores de Física capítulo México, miembro asociado titular del Consejo Mexicano de Investigación Educativa y forma parte de la mesa internacional STEM + Género de Latinoamérica.

      Sus líneas de investigación son: dificultades conceptuales en física mediante la construcción de significados a partir de la socialización del conocimiento, uso efectivo de tecnologías educativas para el aprendizaje de ingeniería y ciencias, y aproximaciones con inteligencia artificial al aprendizaje de la física, STEM y perspectiva de género. Es directora de tesis de maestría de la Escuela de Humanidades y Educación del ITESM y enseña Física mediante aprendizaje basado en retos y evaluación por subcompetencias.

      Santa enseña física de primer año, investiga en educación de la ingeniería y las ciencias y STEM, y es SNI 1. Disfruta jugar con la IA, organizar vivencias STEM con impacto social y perspectiva de género, cantar, ir al cine, la comida vegetariana y jugar con su perrito Jack.
