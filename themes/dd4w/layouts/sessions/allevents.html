{{ define "main" }}

<div class="container mb-4 dd4w-editions">

    {{ partial "dd4w2026/section-head.html" (dict "kicker" "Lista de sesiones" "title" "Conoce las sesiones anteriores de Dev Day 4 Women") }}

    <div class="dd4w-edition-list">

        {{ range sort .Data.Pages.ByDate.Reverse }}
        <a class="dd4w-edition-card" href="{{ .Permalink }}">
            <span class="dd4w-edition-info">
                <span class="dd4w-edition-title">{{ .Params.title }}</span>
                <span class="dd4w-edition-count">{{ .Pages | len }} sesiones</span>
            </span>
            <svg class="dd4w-edition-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </a>
        {{ end }}
    </div>

</div>


{{ end }}
