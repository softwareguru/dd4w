{{ define "main" }}

<div class="container mb-4 dd4w-editions">

    {{ partial "dd4w2026/section-head.html" (dict "kicker" "Lista de sesiones" "title" "Conoce las sesiones anteriores de Dev Day 4 Women") }}

    <div class="dd4w-edition-list">

        {{ range sort .Data.Pages.ByDate.Reverse }}
        <a class="dd4w-edition-card" href="{{ .Permalink }}">
            <span class="dd4w-edition-info">
                <span class="dd4w-edition-title">{{ .Params.title }}</span>
                <span class="dd4w-edition-count">{{ .Pages | len }} sesiones</span>
            </span>
            <svg class="dd4w-edition-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </a>
        {{ end }}
    </div>

</div>

<style>
    :root {
        --dd4w-purple: #965cee;
        --dd4w-purple-dark: #7a3fd6;
        --dd4w-purple-light: #f4edfd;
        --dd4w-text: #2c2c34;
        --dd4w-muted: #6b6b76;
        --dd4w-border: #e8e2f4;
    }

    .dd4w-editions {
        color: var(--dd4w-text);
        width: 85%;
        max-width: 1100px;
        margin: 20px auto 20px auto;

    }

    .dd4w-edition-list {
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
    }

    .dd4w-edition-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        background: #fff;
        border: 1px solid var(--dd4w-border);
        border-radius: 14px;
        padding: 1.1rem 1.4rem;
        text-decoration: none;
        color: inherit;
        transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .dd4w-edition-card:hover {
        border-color: var(--dd4w-purple);
        box-shadow: 0 4px 16px rgba(150, 92, 238, 0.12);
    }

    .dd4w-edition-info {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        min-width: 0;
    }

    .dd4w-edition-title {
        font-weight: 700;
        font-size: 1.02rem;
        color: var(--dd4w-purple-dark);
    }

    .dd4w-edition-count {
        font-size: 0.88rem;
        color: var(--dd4w-muted);
    }

    .dd4w-edition-arrow {
        flex-shrink: 0;
        color: var(--dd4w-purple);
    }

    @media (max-width: 576px) {
        .dd4w-editions {
            width: 95%;
        }
    }
</style>

{{ end }}
